name: Lake
description: "Plan approval for teams running AI coding agents. Sets the lake/plan-approval check when every plan in the PR is approved, for its current version, by a teammate."
author: Lake
branding:
  icon: check-circle
  color: green
inputs:
  token:
    description: GitHub token with statuses:write and pull-requests:write (the default GITHUB_TOKEN works).
    required: false
    default: ${{ github.token }}
  comment:
    description: Post and update one summary comment on the PR.
    required: false
    default: 'true'
  license_key:
    description: Optional Team license key (LAKE_LICENSE_KEY) to lift Free-tier limits (3 users, 20 plan reviews/month).
    required: false
outputs:
  state:
    description: success or failure
runs:
  using: node24
  main: dist/index.mjs
